[theme]
base="dark"
font="Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont="Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize=16
baseRadius="12px"
buttonRadius="10px"
showWidgetBorder=true
showSidebarBorder=true
chartCategoricalColors=["#4DA7B3", "#F0A35A", "#53C68C", "#EF6A5B", "#8B6BC2", "#728079"]

[theme.light]
primaryColor="#2D7D88"
backgroundColor="#F3F6F5"
secondaryBackgroundColor="#FFFFFF"
textColor="#15201D"
linkColor="#216F79"
borderColor="#CFD8D5"
dataframeBorderColor="#CFD8D5"
dataframeHeaderBackgroundColor="#E8EEEC"
redColor="#C9473A"
orangeColor="#D9883D"
yellowColor="#A86C00"
greenColor="#287D59"
blueColor="#2D7D88"
violetColor="#8B6BC2"
grayColor="#728079"

[theme.dark]
primaryColor="#4DA7B3"
backgroundColor="#0B1212"
secondaryBackgroundColor="#121D1D"
textColor="#F4F7F6"
linkColor="#7DCDD7"
borderColor="#35524D"
dataframeBorderColor="#35524D"
dataframeHeaderBackgroundColor="#1A2A28"
redColor="#EF6A5B"
orangeColor="#F0A35A"
yellowColor="#F2C94C"
greenColor="#53C68C"
blueColor="#4DA7B3"
violetColor="#A78BFA"
grayColor="#9BAFA2"

[theme.light.sidebar]
primaryColor="#2D7D88"
backgroundColor="#EEF3F1"
secondaryBackgroundColor="#FFFFFF"
textColor="#26332C"
borderColor="#D9DEDA"
dataframeHeaderBackgroundColor="#E5E8E5"

[theme.dark.sidebar]
primaryColor="#4DA7B3"
backgroundColor="#0E1817"
secondaryBackgroundColor="#172422"
textColor="#F4F7F6"
borderColor="#35524D"
dataframeHeaderBackgroundColor="#1A2A28"
