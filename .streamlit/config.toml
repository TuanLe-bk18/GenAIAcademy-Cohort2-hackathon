[theme]
base="dark"
font="Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont="Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize=14
baseRadius="10px"
buttonRadius="8px"
showWidgetBorder=true
showSidebarBorder=true
chartCategoricalColors=["#43B66E", "#2786A6", "#E67E32", "#D94A3A", "#8B6BC2", "#728079"]

[theme.light]
primaryColor="#43B66E"
backgroundColor="#ECEDEB"
secondaryBackgroundColor="#FFFFFF"
textColor="#26332C"
linkColor="#276F43"
borderColor="#D9DEDA"
dataframeBorderColor="#D9DEDA"
dataframeHeaderBackgroundColor="#E5E8E5"
redColor="#D94A3A"
orangeColor="#E67E32"
yellowColor="#C69700"
greenColor="#43B66E"
blueColor="#2786A6"
violetColor="#8B6BC2"
grayColor="#728079"

[theme.dark]
primaryColor="#4ADE80"
backgroundColor="#07110C"
secondaryBackgroundColor="#102018"
textColor="#F2F7F3"
linkColor="#76D89A"
borderColor="#2D4838"
dataframeBorderColor="#2D4838"
dataframeHeaderBackgroundColor="#182A20"
redColor="#F87171"
orangeColor="#FB923C"
yellowColor="#FACC15"
greenColor="#4ADE80"
blueColor="#38BDF8"
violetColor="#A78BFA"
grayColor="#9BAFA2"

[theme.light.sidebar]
primaryColor="#43B66E"
backgroundColor="#F7F8F6"
secondaryBackgroundColor="#FFFFFF"
textColor="#26332C"
borderColor="#D9DEDA"
dataframeHeaderBackgroundColor="#E5E8E5"

[theme.dark.sidebar]
primaryColor="#4ADE80"
backgroundColor="#0B1710"
secondaryBackgroundColor="#14231A"
textColor="#E8F1EA"
borderColor="#2D4838"
dataframeHeaderBackgroundColor="#182A20"
